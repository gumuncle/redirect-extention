<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>Domain Redirector</title>
    <style>
        body {
            font-family: sans-serif;
            width: 300px;
            padding: 10px;
        }

        /* Only the main input/button should be full width */
        input#redirect-url,
        button#add-rule {
            width: 100%;
            margin-top: 6px;
        }

        ul {
            padding-left: 16px;
        }

        /* Rule list styling */
        .rule-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .rule-text {
            flex: 1 1 auto;
            word-break: break-all;
        }

        .delete-btn {
            flex: 0 0 auto;
            padding: 2px 8px;
            margin-top: 0;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <h3>現在のドメインを登録</h3>
    <div id="current-domain"></div>
    <input type="text" id="redirect-url" placeholder="リダイレクト先URLを入力" />
    <button id="add-rule">登録</button>
    <hr>
    <h4>登録済みルール</h4>
    <ul id="rules-list"></ul>
    <script src="popup.js"></script>
</body>

</html>
