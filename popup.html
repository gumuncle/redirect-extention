<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>Domain Redirector</title>
    <style>
        body {
            font-family: sans-serif;
            width: 300px;
            padding: 10px;
        }

        input,
        button {
            width: 100%;
            margin-top: 6px;
        }

        ul {
            padding-left: 16px;
        }
    </style>
</head>

<body>
    <h3>現在のドメインを登録</h3>
    <div id="current-domain"></div>
    <input type="text" id="redirect-url" placeholder="リダイレクト先URLを入力" />
    <button id="add-rule">登録</button>
    <hr>
    <h4>登録済みルール</h4>
    <ul id="rules-list"></ul>
    <script src="popup.js"></script>
</body>

</html>
